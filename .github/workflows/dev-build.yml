name: Dev Build

# 多版本矩阵并行构建（手动触发，可指定分支、版本白名单与额外参数）。
# versions 留空 = 全版本；填写时按 settings.gradle.kts 中检测到的节点名校验，未知节点直接失败。
on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要构建的分支 (默认：dev)'
        required: true
        default: 'dev'
        type: string
      versions:
        description: '仅构建指定版本节点，逗号分隔（如 1.21.11,26.3）。留空 = 构建全部版本'
        required: false
        default: ''
        type: string
      additional_args:
        description: '额外的 Gradle 构建参数 (可选)'
        required: false
        default: ''
        type: string

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
      mod_version: ${{ steps.versions.outputs.mod_version }}
      build_timestamp: ${{ steps.timestamp.outputs.timestamp }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Detect Minecraft Versions and Mod Version
        id: versions
        shell: bash
        env:
          REQUESTED_VERSIONS: ${{ github.event.inputs.versions }}
        run: |
          set -euo pipefail

          ALL_VERSIONS=$(
            (
              # version(project = "x", version = "y") -> capture project name
              grep -oE 'version\s*\([^)]*project\s*=\s*"[^"]+"' settings.gradle.kts \
                | grep -oE 'project\s*=\s*"[^"]+"' \
                | cut -d'"' -f2

              # version("x") -> capture direct version node (supports 26.1 / 26.1.1 / 26.1.2 ...)
              grep -oE 'version\s*\(\s*"[^"]+"\s*\)' settings.gradle.kts \
                | grep -oE '"[^"]+"' \
                | tr -d '"'

              # versions("a", "b", ...) -> capture every listed version
              grep -oE 'versions\s*\([^)]+\)' settings.gradle.kts \
                | grep -oE '"[^"]+"' \
                | tr -d '"'
            ) | awk 'NF && !seen[$0]++' | paste -sd ',' -
          )

          echo "Detected versions: $ALL_VERSIONS"

          # 手动输入：逗号分隔的版本白名单；留空则构建全部检测到的版本。
          REQUESTED=$(echo "${REQUESTED_VERSIONS:-}" | tr ',' ' ' | xargs)

          if [ -n "$REQUESTED" ]; then
            VERSIONS=""
            for v in $REQUESTED; do
              # 逗号包裹后精确匹配，避免 "1.21.1" 误命中 "1.21.11"
              if ! echo ",$ALL_VERSIONS," | grep -qF ",$v,"; then
                echo "::error::未知的 Minecraft 版本节点 '$v'。可用节点：$ALL_VERSIONS"
                exit 1
              fi
              case ",$VERSIONS," in
                *",$v,"*) continue ;;
              esac
              VERSIONS="${VERSIONS:+$VERSIONS,}$v"
            done
            echo "Manual selection: $VERSIONS"
          else
            VERSIONS="$ALL_VERSIONS"
            echo "Building all versions"
          fi

          VERSIONS_JSON=$(
            echo "$VERSIONS" \
              | tr ',' '\n' \
              | jq -R -s -c 'split("\n") | map(select(length > 0))'
          )

          echo "versions=$VERSIONS_JSON" >> "$GITHUB_OUTPUT"

          MOD_VERSION=$(
            grep -E '^mod\.version\s*=' gradle.properties \
              | head -n1 \
              | cut -d'=' -f2- \
              | xargs
          )

          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          echo "Mod version: $MOD_VERSION"

      - name: Generate Build Timestamp
        id: timestamp
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "Build timestamp: $TIMESTAMP"

  build-version:
    needs: detect-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.detect-versions.outputs.versions) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Setup JDK 21
        if: "!startsWith(matrix.version, '26')"
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup JDK 25
        if: "startsWith(matrix.version, '26')"
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Version ${{ matrix.version }}
        run: |
          EXTRA_ARGS="${{ github.event.inputs.additional_args }}"
          if [ -z "$EXTRA_ARGS" ]; then
            ./gradlew :${{ matrix.version }}:build --stacktrace
          else
            ./gradlew :${{ matrix.version }}:build --stacktrace $EXTRA_ARGS
          fi

      - name: Upload Build Artifacts for ${{ matrix.version }}
        uses: actions/upload-artifact@v4
        with:
          name: lumichat-dev-${{ needs.detect-versions.outputs.build_timestamp }}-mc${{ matrix.version }}
          path: |
            versions/${{ matrix.version }}/build/libs/*.jar
            !versions/${{ matrix.version }}/build/libs/*-dev.jar
          if-no-files-found: error
          retention-days: 30

  build-summary:
    needs: [detect-versions, build-version]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Build Results
        run: |
          echo "## Dev Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** ${{ github.event.inputs.branch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Build Time:** ${{ needs.detect-versions.outputs.build_timestamp }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Mod Version:** ${{ needs.detect-versions.outputs.mod_version }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ github.event.inputs.versions }}" ]; then
            echo "**Requested Versions:** ${{ github.event.inputs.versions }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Requested Versions:** (all)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Minecraft Version | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------------------|--------|" >> "$GITHUB_STEP_SUMMARY"

          for version in ${{ join(fromJson(needs.detect-versions.outputs.versions), ' ') }}; do
            echo "| $version | See build-version ($version) |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Fail if any build failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
