name: Dev Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要构建的分支 (默认：dev)'
        required: true
        default: 'dev'
        type: string
      additional_args:
        description: '额外的 Gradle 构建参数 (可选)'
        required: false
        default: ''
        type: string

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dynamically detect available versions from settings.gradle.kts
  detect-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
      mod_version: ${{ steps.versions.outputs.mod_version }}
      build_timestamp: ${{ steps.timestamp.outputs.timestamp }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Detect Minecraft Versions and Mod Version
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          VERSIONS=$(
            (
              # version(project = "x", version = "y") -> capture project name
              grep -oE 'version\s*\([^)]*project\s*=\s*"[^"]+"' settings.gradle.kts \
                | grep -oE 'project\s*=\s*"[^"]+"' \
                | cut -d'"' -f2

              # version("x") -> capture direct version node (supports 26.1 / 26.1.1 / 26.1.2 ...)
              grep -oE 'version\s*\(\s*"[^"]+"\s*\)' settings.gradle.kts \
                | grep -oE '"[^"]+"' \
                | tr -d '"'

              # versions("a", "b", ...) -> capture every listed version
              grep -oE 'versions\s*\([^)]+\)' settings.gradle.kts \
                | grep -oE '"[^"]+"' \
                | tr -d '"'
            ) | awk 'NF && !seen[$0]++' | grep -vE '^26(\.|$)' | paste -sd ',' -
          )

          echo "Detected versions (JDK 21 CI): $VERSIONS"

          VERSIONS_JSON=$(
            echo "$VERSIONS" \
              | tr ',' '\n' \
              | jq -R -s -c 'split("\n") | map(select(length > 0))'
          )

          echo "versions=$VERSIONS_JSON" >> "$GITHUB_OUTPUT"

          MOD_VERSION=$(
            grep -E '^mod\.version\s*=' gradle.properties \
              | head -n1 \
              | cut -d'=' -f2- \
              | xargs
          )

          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          echo "Mod version: $MOD_VERSION"

      - name: Generate Build Timestamp
        id: timestamp
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "Build timestamp: $TIMESTAMP"

  # Build each version independently
  build-version:
    needs: detect-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.detect-versions.outputs.versions) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Version ${{ matrix.version }}
        run: |
          EXTRA_ARGS="${{ github.event.inputs.additional_args }}"
          if [ -z "$EXTRA_ARGS" ]; then
            ./gradlew :${{ matrix.version }}:build --stacktrace
          else
            ./gradlew :${{ matrix.version }}:build --stacktrace $EXTRA_ARGS
          fi

      - name: Upload Build Artifacts for ${{ matrix.version }}
        uses: actions/upload-artifact@v4
        with:
          name: lumichat-dev-${{ needs.detect-versions.outputs.build_timestamp }}-mc${{ matrix.version }}
          path: versions/${{ matrix.version }}/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 30

  # Summary job to report overall status
  build-summary:
    needs: [detect-versions, build-version]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Build Results
        run: |
          echo "## Dev Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.event.inputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build Time:** ${{ needs.detect-versions.outputs.build_timestamp }}" >> $GITHUB_STEP_SUMMARY
          echo "**Mod Version:** ${{ needs.detect-versions.outputs.mod_version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Minecraft Version | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------------|--------|" >> $GITHUB_STEP_SUMMARY
          
          for version in ${{ join(fromJson(needs.detect-versions.outputs.versions), ' ') }}; do
            echo "| $version | See build-version ($version) |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Fail if any build failed
        if: contains(needs.*.result, 'failure')
        run: exit 1

  # Collect and package all successful builds into a single ZIP
  package-artifacts:
    needs: [detect-versions, build-version]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: lumichat-dev-*
          merge-multiple: false

      - name: Organize Artifacts
        run: |
          mkdir -p packaged-artifacts
          echo "Organizing artifacts..."
          # Only copy JAR files that don't contain 'sources' in their name
          find artifacts -name "*.jar" -type f ! -name "*sources*" -exec cp {} packaged-artifacts/ \;
          echo "Filtered out sources JARs, keeping only main JARs:"
          ls -la packaged-artifacts/

      - name: Create ZIP Archive
        run: |
          cd packaged-artifacts
          zip -r ../lumichat-dev-${{ needs.detect-versions.outputs.build_timestamp }}-all-builds.zip .
          cd ..
          echo "Created ZIP archive:"
          ls -lh lumichat-dev-*.zip

      - name: Upload Combined ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lumichat-dev-${{ needs.detect-versions.outputs.build_timestamp }}-all-builds
          path: lumichat-dev-${{ needs.detect-versions.outputs.build_timestamp }}-all-builds.zip
          retention-days: 30
          if-no-files-found: error
