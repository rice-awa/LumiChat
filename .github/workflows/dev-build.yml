name: Dev Build

# 单 job buildAndCollect 构建（手动触发，可指定分支与额外参数）。
on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要构建的分支 (默认：dev)'
        required: true
        default: 'dev'
        type: string
      additional_args:
        description: '额外的 Gradle 构建参数 (可选)'
        required: false
        default: ''
        type: string

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Setup Base JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Generate Build Timestamp
        id: timestamp
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "Build timestamp: $TIMESTAMP"

      - name: Resolve Mod Version
        id: modver
        run: |
          MOD_VERSION=$(grep -E '^mod\.version\s*=' gradle.properties | head -n1 | cut -d'=' -f2- | xargs)
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          echo "Mod version: $MOD_VERSION"

      - name: Build and Collect All Versions
        run: |
          EXTRA_ARGS="${{ github.event.inputs.additional_args }}"
          if [ -z "$EXTRA_ARGS" ]; then
            ./gradlew buildAndCollect --stacktrace
          else
            ./gradlew buildAndCollect --stacktrace $EXTRA_ARGS
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumichat-dev-${{ steps.timestamp.outputs.timestamp }}-all-builds
          path: build/libs/
          if-no-files-found: error
          retention-days: 30

  summary:
    needs: dev-build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Dev Build Summary
        run: |
          echo "## Dev Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.event.inputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "**Result:** ${{ needs.dev-build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All Minecraft versions built via \`./gradlew buildAndCollect\`." >> $GITHUB_STEP_SUMMARY

      - name: Fail if build failed
        if: ${{ needs.dev-build.result != 'success' }}
        run: exit 1