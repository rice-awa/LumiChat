name: PR Check

# PR 检查：单 job buildAndCollect（build.gradle.kts 中 buildAndCollect dependsOn("build")
# 因此会顺带跑 check/test），不再用矩阵 + 逐版本 :build。
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Setup Base JDK 25
        # Gradle 运行环境必须 >=25，否则 26.x 节点会被 settings.gradle.kts 跳过。
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build and Collect All Versions
        run: ./gradlew buildAndCollect --stacktrace

  summary:
    needs: check
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: PR Check Summary
        run: |
          echo "## PR Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Result: ${{ needs.check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All Minecraft versions checked via \`./gradlew buildAndCollect\`." >> $GITHUB_STEP_SUMMARY

      - name: Fail if check failed
        if: ${{ needs.check.result != 'success' }}
        run: exit 1