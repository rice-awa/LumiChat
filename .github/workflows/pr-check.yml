name: PR Check

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dynamically detect available versions from settings.gradle.kts
  detect-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Detect Minecraft Versions
        id: versions
        run: |
          # Extract versions from both version(...) and versions(...) calls
          # Match project names from version(project = "...") and versions("...")
          VERSIONS=$(grep -oE 'version\s*\([^)]+project\s*=\s*"[^"]+"' settings.gradle.kts | grep -oE 'project\s*=\s*"[^"]+"' | cut -d'"' -f2 | tr '\n' ',' ; grep -oE 'versions\([^)]+\)' settings.gradle.kts | grep -oE '"[^"]+"' | tr -d '"' | tr '\n' ',') | sed 's/,$//' | sed 's/^,//')
          echo "Detected versions: $VERSIONS"
          # Format as JSON array for matrix
          VERSIONS_JSON=$(echo "$VERSIONS" | tr ',' '\n' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "versions=$VERSIONS_JSON" >> $GITHUB_OUTPUT

  # Check each version independently
  check-version:
    needs: detect-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.detect-versions.outputs.versions) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Run Checks for Version ${{ matrix.version }}
        run: ./gradlew :${{ matrix.version }}:check --stacktrace

      - name: Build Version ${{ matrix.version }}
        run: ./gradlew :${{ matrix.version }}:build --stacktrace

  # Summary job to report overall PR status
  pr-summary:
    needs: [detect-versions, check-version]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate PR Check Summary
        run: |
          echo "## PR Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All supported Minecraft versions have been checked." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Minecraft Version | Check | Build |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------------|-------|-------|" >> $GITHUB_STEP_SUMMARY
          
          for version in ${{ join(fromJson(needs.detect-versions.outputs.versions), ' ') }}; do
            echo "| $version | See job logs | See job logs |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Fail if any check failed
        if: contains(needs.*.result, 'failure')
        run: exit 1