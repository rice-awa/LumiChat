name: Build

# 依照 Stonecutter 官方模板 + 社区推荐（rotgruengelb）改造为单 job buildAndCollect：
# - 一次 ./gradlew buildAndCollect 构建并收集所有 Minecraft 版本产物到 build/libs/<mod.version>/
# - toolchain 自动按各版本 requiredJava 下载所需 JDK（8/21/25）
# - 删除原先 detect-versions matrix + 二次聚合 package-artifacts
# 参考：https://github.com/stonecutter-versioning/stonecutter-template-fabric
#      https://github.com/rotgruengelb/stonecutter-mod-template
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Setup Base JDK 25
        # Gradle 运行环境必须 >=25，否则 settings.gradle.kts 中 supportsMc26 会跳过 26.x 节点。
        # 各版本编译 JDK 仍由 toolchain auto-download 解析（8/21/25）。
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Resolve Mod Version
        id: modver
        run: |
          MOD_VERSION=$(grep -E '^mod\.version\s*=' gradle.properties | head -n1 | cut -d'=' -f2- | xargs)
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          echo "Mod version: $MOD_VERSION"

      - name: Build and Collect All Versions
        run: ./gradlew buildAndCollect --stacktrace

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumichat-${{ steps.modver.outputs.mod_version }}-all-builds
          path: build/libs/
          if-no-files-found: error
          retention-days: 90

  summary:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build Summary
        shell: bash
        run: |
          echo "## Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: ${{ needs.build.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All Minecraft versions built via \`./gradlew buildAndCollect\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if build failed
        if: ${{ needs.build.result != 'success' }}
        run: exit 1