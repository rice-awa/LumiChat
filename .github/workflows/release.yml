name: Release

# 手动触发的发布工作流。改为单 job buildAndCollect 后：
# - 一次构建收集所有版本到 build/libs/<mod.version>/
# - publish-release 下载该 artifact 上传到 GitHub Release
# 默认发布为草稿，便于在 GitHub UI 审核后再正式发布。
on:
  workflow_dispatch:
    inputs:
      draft:
        description: 发布为草稿（审核后再正式发布）
        required: false
        type: boolean
        default: true
      tag_name:
        description: 'Release 标签名（留空则用 v<mod.version>，如 v2.1.0）'
        required: false
        type: string
        default: ''
      release_name:
        description: 'Release 标题（留空则用 LumiChat <mod.version>）'
        required: false
        type: string
        default: ''
      since_ref:
        description: '变更日志起始引用（tag/SHA/分支，留空自动检测上一个 tag）'
        required: false
        type: string
        default: ''

# 最小权限：顶层只读，发布作业单独提权
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      mod_version: ${{ steps.modver.outputs.mod_version }}
      versions: ${{ steps.versions.outputs.versions }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      release_name: ${{ steps.resolve.outputs.release_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Setup Base JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Resolve Mod Version
        id: modver
        run: |
          MOD_VERSION=$(grep -E '^mod\.version\s*=' gradle.properties | head -n1 | cut -d'=' -f2- | xargs)
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          echo "Mod version: $MOD_VERSION"

      - name: Resolve Tag and Release Name
        id: resolve
        run: |
          set -euo pipefail
          MOD_VERSION="${{ steps.modver.outputs.mod_version }}"
          TAG="${{ inputs.tag_name }}"
          if [[ -z "$TAG" ]]; then TAG="v${MOD_VERSION}"; fi
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          NAME="${{ inputs.release_name }}"
          if [[ -z "$NAME" ]]; then NAME="LumiChat ${MOD_VERSION}"; fi
          echo "release_name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Detect Supported Minecraft Versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          VERSIONS=$(
            (
              grep -oE 'version\s*\([^)]*project\s*=\s*"[^"]+"' settings.gradle.kts \
                | grep -oE 'project\s*=\s*"[^"]+"' | cut -d'"' -f2
              grep -oE 'version\s*\(\s*"[^"]+"\s*\)' settings.gradle.kts \
                | grep -oE '"[^"]+"' | tr -d '"'
              grep -oE 'versions\s*\([^)]+\)' settings.gradle.kts \
                | grep -oE '"[^"]+"' | tr -d '"'
            ) | awk 'NF && !seen[$0]++' | paste -sd ',' -
          )
          VERSIONS_JSON=$(echo "$VERSIONS" | tr ',' '\n' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "versions=$VERSIONS_JSON" >> "$GITHUB_OUTPUT"

      - name: Build and Collect All Versions
        run: ./gradlew buildAndCollect --stacktrace

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumichat-${{ steps.modver.outputs.mod_version }}-all-builds
          path: build/libs/
          if-no-files-found: error
          retention-days: 90

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Build Artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts
          name: lumichat-${{ needs.build.outputs.mod_version }}-all-builds

      - name: List Release Artifacts
        run: |
          echo "Release artifacts:"
          find release-artifacts -type f -name "*.jar" || echo "No JAR files found"

      - name: Generate Chinese Changelog
        id: changelog
        env:
          SINCE_REF: ${{ inputs.since_ref }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .github/scripts/generate-changelog.sh
          CHANGELOG="$(bash .github/scripts/generate-changelog.sh "$SINCE_REF" "HEAD")"

          VERSIONS='${{ needs.build.outputs.versions }}'
          VERSIONS_LIST="$(printf '%s' "$VERSIONS" | jq -r '. | join(", ")')"

          {
            echo "## 模组信息"
            echo ""
            echo "- 模组版本：${{ needs.build.outputs.mod_version }}"
            echo "- 支持的 Minecraft 版本：${VERSIONS_LIST}"
            echo ""
            echo "## 变更日志"
            echo ""
            printf '%s\n' "$CHANGELOG"
          } > release_body.md

          echo "=== Release 正文预览 ==="
          cat release_body.md

          {
            echo "body<<EOF"
            cat release_body.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag_name }}
          name: ${{ needs.build.outputs.release_name }}
          draft: ${{ inputs.draft }}
          target_commitish: ${{ github.sha }}
          body: ${{ steps.changelog.outputs.body }}
          files: release-artifacts/**/*.jar
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-summary:
    needs: [build, publish-release]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate Release Summary
        shell: bash
        run: |
          set -euo pipefail
          echo "## 发布总结" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 模组版本：${{ needs.build.outputs.mod_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 草稿状态：${{ inputs.draft && '是（草稿）' || '否（正式发布）' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 构建/发布：${{ needs.build.result }} / ${{ needs.publish-release.result }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any step failed
        if: ${{ needs.build.result != 'success' || needs.publish-release.result != 'success' }}
        run: exit 1